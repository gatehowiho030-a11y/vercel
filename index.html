<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钱包连接</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #16213e;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 20px;
            margin: 0 auto 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }
        .connected-info {
            background-color: #0f3460;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            word-break: break-all;
        }
        .network-info {
            background-color: #0f3460;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
        }
        .confirm-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            margin: 1rem 0;
        }
        .hint-text {
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>钱包连接成功</h1>
        <p>确认纳入全链空投白名单</p>
        
        <div class="connected-info" id="addressDisplay">
            已连接钱包：<span id="walletAddress">未连接</span>
        </div>
        
        <div class="network-info">
            当前网络：<span id="currentNetwork">未检测</span>
        </div>
        
        <button class="confirm-btn" id="confirmBtn">确认备案 录入白名单</button>
        <p class="hint-text">仅全链地址备案核验，不会划转任何资产</p>
    </div>

    <script>
        // 链配置表（支持主流链，可自行扩展）
        const CHAINS = {
            1: { name: "以太坊主网", symbol: "ETH" },
            56: { name: "BSC币安链", symbol: "BNB" },
            137: { name: "Polygon链", symbol: "MATIC" },
            42161: { name: "Arbitrum链", symbol: "ETH" },
            10: { name: "Optimism链", symbol: "ETH" }
        };

        // 全局状态
        let currentChainId = null;
        let userAddress = null;

        // DOM 元素
        const walletAddressEl = document.getElementById('walletAddress');
        const currentNetworkEl = document.getElementById('currentNetwork');
        const confirmBtn = document.getElementById('confirmBtn');

        // 初始化钱包连接
        async function initWallet() {
            // 检测是否支持 window.ethereum（兼容MetaMask/TP/OKX等主流钱包）
            if (!window.ethereum) {
                alert("请安装支持EIP-1193的钱包，如MetaMask/TP钱包");
                return;
            }

            try {
                // 1. 获取用户账户
                const accounts = await window.ethereum.request({
                    method: 'eth_requestAccounts'
                });
                userAddress = accounts[0];
                walletAddressEl.textContent = userAddress;

                // 2. 获取当前链ID并更新显示
                await updateChainStatus();

                // 3. 监听链切换事件（核心修复点！）
                window.ethereum.on('chainChanged', async (chainIdHex) => {
                    // chainIdHex 是16进制格式，转成十进制
                    const chainId = parseInt(chainIdHex, 16);
                    currentChainId = chainId;
                    // 更新页面显示
                    updateNetworkDisplay(chainId);
                    // 可选：链切换后刷新交易逻辑（避免旧链缓存）
                    console.log("链已切换，新链ID:", chainId);
                });

                // 4. 监听账户切换事件（用户换钱包地址时更新）
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        alert("钱包已断开连接，请重新连接");
                        walletAddressEl.textContent = "未连接";
                        userAddress = null;
                    } else {
                        userAddress = accounts[0];
                        walletAddressEl.textContent = userAddress;
                    }
                });

            } catch (error) {
                console.error("钱包连接失败:", error);
                alert("钱包连接失败，请重试");
            }
        }

        // 更新链状态（首次加载和切换时调用）
        async function updateChainStatus() {
            const chainIdHex = await window.ethereum.request({
                method: 'eth_chainId'
            });
            currentChainId = parseInt(chainIdHex, 16);
            updateNetworkDisplay(currentChainId);
        }

        // 更新页面上的网络显示文本
        function updateNetworkDisplay(chainId) {
            const chainInfo = CHAINS[chainId];
            if (chainInfo) {
                currentNetworkEl.textContent = chainInfo.name;
            } else {
                currentNetworkEl.textContent = `未知链 (ID: ${chainId})`;
            }
        }

        // 确认按钮点击事件（多链适配）
        confirmBtn.addEventListener('click', async () => {
            if (!userAddress || !currentChainId) {
                alert("请先连接钱包并确保网络正常");
                return;
            }

            // 这里写你的交易/备案逻辑，会自动用当前链的ID
            console.log("备案请求：", {
                address: userAddress,
                chainId: currentChainId,
                network: CHAINS[currentChainId]?.name || "未知链"
            });

            // 示例：如果是交易，会自动适配当前链，不会再固定为BSC
            alert(`已成功备案\n地址：${userAddress}\n网络：${CHAINS[currentChainId]?.name || "未知链"}`);
        });

        // 页面加载完成后初始化
        window.addEventListener('load', initWallet);
    </script>
</body>
</html>
